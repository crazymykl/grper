[package]
name = "grper"
version = "0.2.0"
authors = ["Mike MacDonald <crazymykl@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read and write Ken Silverman's Build engine GRP archive files"
repository = "https://github.com/crazymykl/grper"

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]
# Exposes the `FlakyReader` and `FlakyWriter` test doubles (see `grper::testutil`).
testutil = []

[dev-dependencies]

assert_cmd = "2"
predicates = "3"
tempfile = "3"

# The binary's tests fault the archive's I/O, so they need the test doubles;
# enabling the feature here keeps them out of a normal `cli` build. `default-features`
# is off so this does not re-enable the `cli` feature in a `--no-default-features`
# test build.
grper = { path = ".", default-features = false, features = ["testutil"] }

[dependencies]
thiserror = "2"

# CLI only — keep the library itself std + thiserror.
[dependencies.anyhow]
version = "1"
optional = true

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[[bin]]
name = "grper"
required-features = ["cli"]
